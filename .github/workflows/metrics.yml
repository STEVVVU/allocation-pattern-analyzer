name: Allocation analyzer reproducible metrics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    strategy:
      fail-fast: false
      matrix:
        kernel: ['6.1', '6.6']
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PIP_CONSTRAINT: ${{ github.workspace }}/requirements-ci.txt
      PIP_BUILD_CONSTRAINT: ${{ github.workspace }}/requirements-ci.txt
      RUSTUP_TOOLCHAIN: 1.99.1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11.9'
      - run: rustup toolchain install 1.99.1 --profile minimal
      - run: |
          python -m pip install pip==26.2.2
          python -m pip install --constraint requirements-ci.txt --build-constraint requirements-ci.txt angr==9.2.207 unicorn==2.1.4
      - run: sudo apt-get update && sudo apt-get install --yes bc bison build-essential flex libelf-dev libssl-dev
      - run: bash .agents/skills/verify-allocation-pattern-analyzer/scripts/build-kernel-vmlinux.sh "$RUNNER_TEMP/metrics-kernel" '${{ matrix.kernel }}'
      - run: python -I .agents/skills/verify-allocation-pattern-analyzer/scripts/benchmark.py --run-id metrics-${{ matrix.kernel }}-${{ github.run_id }} --kernel-binary "$RUNNER_TEMP/metrics-kernel/linux-${{ matrix.kernel }}/vmlinux"
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        if: always()
        with:
          name: allocation-metrics-${{ matrix.kernel }}-${{ github.run_id }}
          include-hidden-files: true
          path: .agents/runs/metrics-${{ matrix.kernel }}-${{ github.run_id }}/
          retention-days: 30
